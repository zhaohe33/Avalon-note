<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="按座位顺序录入阿瓦隆发言，每次切换自动生成发言要点。">
  <title>圆桌档案 · 发言记录</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header><span aria-hidden="true">⚔</span> 圆桌档案</header>
    <section class="panel">
      <form id="setup">
        <h1>安排发言顺序</h1>
        <label for="names">玩家名字</label>
        <p id="order-hint">每行填一个名字，从上到下就是发言顺序。</p>
        <textarea id="names" rows="5" maxlength="600" required aria-describedby="order-hint" placeholder="小林&#10;阿杰&#10;小周"></textarea>
        <button id="start">开始录制第一位</button>
      </form>
      <div id="session" hidden>
        <p class="progress" id="progress"></p>
        <h1 id="speaker"></h1>
        <p id="status" role="status"></p>
        <p id="live" class="live" hidden></p>
        <button id="advance">结束并录制下一位</button>
      </div>
      <p id="notice" role="alert" hidden></p>
    </section>
    <section class="panel results" id="results" hidden>
      <h2>发言摘要</h2>
      <ol id="summaries"></ol>
    </section>
  </main>
</body>
</html>
